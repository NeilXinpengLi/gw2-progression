name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check --output-format=github
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest-cov
      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=term --cov-fail-under=69 -v --tb=short -q
        env:
          CI: "true"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Docker production image
        run: docker build --target production -t gw2-progression .
      - name: Test production image starts
        run: |
          docker run -d -p 8000:8000 --name gw2-test gw2-progression
          sleep 10
          curl -f http://localhost:8000/health || (docker logs gw2-test && exit 1)
      - name: Test production API responds
        run: |
          curl -f http://localhost:8000/metrics || exit 1
          docker stop gw2-test && docker rm gw2-test
      - name: Build Docker compose stack
        run: docker compose -f docker-compose.prod.yml build
